<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Создай свой аккаунт</title>
<style>
  @font-face { font-family: "Press Start 2P"; src: url("fonts/pole/PressStart2P-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Caveat"; src: url("fonts/pole/Caveat-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Marck Script"; src: url("fonts/pole/MarckScript-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Pacifico"; src: url("fonts/pole/Pacifico-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Russo One"; src: url("fonts/pole/RussoOne-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Comfortaa"; src: url("fonts/pole/Comfortaa.ttf") format("truetype"); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: "Playfair Display"; src: url("fonts/pole/PlayfairDisplay.ttf") format("truetype"); font-weight: 400 900; font-display: swap; }
  @font-face { font-family: "Lobster"; src: url("fonts/pole/Lobster-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "PT Serif"; src: url("fonts/pole/PTSerif-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Bad Script"; src: url("fonts/pole/BadScript-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Philosopher"; src: url("fonts/pole/Philosopher-Regular.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Yeseva One"; src: url("fonts/pole/YesevaOne-Regular.ttf") format("truetype"); font-display: swap; }

  :root { --face: #c0c0c0; --hi: #fff; --lo: #808080; --dk: #0a0a0a; --title: #000080; --desk: #008080; --paper: #fff; --fg: #000; --accent: #000080; --line: #808080; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 24px 12px 64px; background: var(--desk); color: #000; font: 12px/1.7 "Press Start 2P", Tahoma, monospace; display: flex; justify-content: center; }
  main { max-width: 40rem; width: 100%; }

  .win, dialog { padding: 3px; border: 0; background: var(--face); color: #000; box-shadow: inset -1px -1px var(--dk), inset 1px 1px #dfdfdf, inset -2px -2px var(--lo), inset 2px 2px var(--hi), 2px 2px 0 var(--dk); }
  .tb { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 24px; padding: 3px 3px 3px 6px; background: var(--title); color: #fff; font-weight: 400; user-select: none; }
  .tb h1, .tb .tt { margin: 0; font-size: 12px; line-height: 1.4; font-weight: 400; color: inherit; }
  .tbtns { display: flex; gap: 2px; }
  .tbtns button { width: 20px; height: 18px; padding: 0; color: #000; display: flex; align-items: center; justify-content: center; }
  .tbtns svg { width: 10px; height: 10px; fill: currentColor; stroke: none; }
  #cardTb { touch-action: none; cursor: move; }
  #cardTb button { cursor: default; }
  .inner { padding: 14px; }

  button { font: inherit; color: #000; cursor: pointer; padding: 5px 14px; background: var(--face); border: 0; box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px #dfdfdf; }
  button:active:not(:disabled) { box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--lo), inset -2px -2px #dfdfdf, inset 2px 2px var(--dk); padding: 6px 13px 4px 15px; }
  button:disabled { color: var(--lo); text-shadow: 1px 1px 0 var(--hi); cursor: not-allowed; }
  button:focus-visible { outline: 1px dotted #000; outline-offset: -5px; }
  .tbtns button:active:not(:disabled) { padding: 0; }

  input[type="text"], select, textarea { display: block; width: 100%; margin-top: 3px; padding: 5px 6px; font: inherit; color: #000; background: #fff; border: 0; box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--lo), inset -2px -2px #dfdfdf, inset 2px 2px var(--dk); }
  select option { color: #000; }
  fieldset { margin: 0 0 .9rem; padding: 8px 10px 10px; border: 1px solid var(--lo); box-shadow: 1px 1px 0 var(--hi); }
  legend { padding: 0 4px; }
  label.field { display: block; margin: 0 0 .9rem; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 .9rem; }
  .info { color: #000; }
  .swatch { display: inline-block; width: 22px; height: 22px; vertical-align: middle; background: repeating-linear-gradient(45deg, #eee 0 4px, #ddd 4px 8px); box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--lo), inset -2px -2px #dfdfdf, inset 2px 2px var(--dk); }
  .circle svg { width: 24px; height: 24px; }
  .circle { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 2px solid var(--dk); border-radius: 50%; font-size: 20px; line-height: 1; background: #fff; }
  .pronouns { display: flex; align-items: center; gap: 10px; }
  .pronouns select { width: auto; margin: 0; min-width: 7rem; }

  .sensor { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dotted var(--lo); }
  .sensor:last-child { border-bottom: 0; }
  .sw { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sw .track { position: relative; width: 17px; height: 17px; background: #fff; box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--lo), inset -2px -2px #dfdfdf, inset 2px 2px var(--dk); }
  .sw input:checked + .track::after { content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 14px/1 Arial, sans-serif; color: #000; }
  .sw input:focus-visible + .track { outline: 1px dotted #000; outline-offset: 2px; }
  .sw .txt { min-width: 2.2em; }

  .plist { list-style: none; margin: 0; padding: 0; }
  .plist li { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px dotted var(--lo); }
  .plist li:last-child { border-bottom: 0; }
  .plist .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .iconb { display: flex; align-items: center; justify-content: center; width: 36px; height: 32px; padding: 0; }
  .iconb:active:not(:disabled) { padding: 0; }
  .iconb svg { width: 24px; height: 24px; color: #000; }
  .big { display: block; width: 100%; margin: 14px 0 0; padding: 12px; font-size: 14px; font-weight: 400; }
  .big:active:not(:disabled) { padding: 11px 9px 9px 11px; }

  #cardWin { position: fixed; z-index: 50; width: min(94vw, 34rem); }
  .client { margin-top: 3px; padding: 2px; max-height: 70vh; overflow: auto; background: var(--face); box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--lo), inset -2px -2px #dfdfdf, inset 2px 2px var(--dk); }
  .win.min .client { display: none; }
  .win.max { left: 0 !important; top: 0 !important; width: 100vw !important; height: 100vh; display: flex; flex-direction: column; }
  .win.max .client { flex: 1; max-height: none; }
  .win.max #cardTb { cursor: default; }
  .cardBody { min-height: 120px; padding: 22px; overflow-wrap: anywhere; background: var(--c, #ddd); color: var(--tc, #000); }
  .win.max .cardBody { min-height: calc(100vh - 56px); }
  .head { display: flex; align-items: center; gap: 14px; margin: 0 0 .9rem; }
  .head .circle svg { width: 48px; height: 48px; }
  .head .circle { width: 64px; height: 64px; font-size: 28px; flex: none; background: transparent; border-color: currentColor; color: inherit; }
  .nick { font-size: 20px; line-height: 1.5; }
  .pron { font-size: .6em; font-weight: 400; margin-left: .4em; }
  .sub { font-size: 12px; }
  .post { position: relative; margin: .6rem 0 0; padding: 10px 56px 10px 12px; border: 2px solid; border-color: #fff var(--dk) var(--dk) #fff; background: var(--pc, #eee); }
  .post .t { font-size: 13px; font-weight: 400; display: block; }
  .post p { margin: .2rem 0 0; white-space: pre-wrap; }
  .post .mini { position: absolute; top: 8px; right: 8px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 2px solid currentColor; border-radius: 50%; background: #fff; }
  .meta { margin-top: .3rem; }
  .ppl { margin-left: .5em; font-style: italic; }
  .wchip { display: inline-block; margin: 2px 1px; padding: 0 .35em; border-radius: 0; }
  svg { shape-rendering: crispEdges; }
  svg.st { width: 24px; height: 24px; }

  dialog { width: min(94vw, 28rem); }
  dialog::backdrop { background: rgba(0, 128, 128, .45); }
  .dbody { padding: 14px; }
  .buttons { display: flex; gap: 10px; justify-content: flex-end; }
  .pick-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .pick { position: relative; display: block; cursor: pointer; }
  .pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .chip { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: var(--face); box-shadow: inset -1px -1px var(--dk), inset 1px 1px var(--hi), inset -2px -2px var(--lo), inset 2px 2px #dfdfdf; }
  .chip svg { width: 48px; height: 48px; }
  .pick input:checked + .chip { background: #e8e8c0; box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--lo), inset -2px -2px #dfdfdf, inset 2px 2px var(--dk); }
  .pick input:focus-visible + .chip { outline: 1px dotted #000; outline-offset: 2px; }
  .status { margin: 14px 0 0; padding: 6px 8px; font-size: 8px; line-height: 1.8; box-shadow: inset -1px -1px var(--hi), inset 1px 1px var(--lo); }
  #err { color: #a00000; margin: 0 0 .75rem; min-height: 1.4em; }
</style>
</head>
<body>
<main>

  <section class="win">
    <div class="tb"><h1>Создай свой аккаунт</h1></div>
    <div class="inner">
    <div class="row">
      <button type="button" id="bgBtn">Цвет фона</button>
      <span class="info"><span class="swatch" id="bgSwatch"></span> <span id="bgCode">—</span> · нажатий: <b id="bgCount">0</b></span>
    </div>

    <div class="row">
      <button type="button" id="iconBtn">Выбор иконки</button>
      <span class="circle" id="iconView">?</span>
    </div>

    <label class="field">Имя <input type="text" id="name" placeholder="впиши имя" maxlength="40" autocomplete="off"></label>
    <label class="field">Юзер <input type="text" id="user" placeholder="впиши юзер" maxlength="30" autocomplete="off"></label>

    <fieldset>
      <legend>Местоимения</legend>
      <div class="pronouns"><select id="pron1" aria-label="Местоимение"></select><span>/</span><select id="pron2" aria-label="Форма"></select></div>
    </fieldset>

    <div id="sensors"></div>

    <div class="row" style="margin-top:1rem">
      <button type="button" id="postBtn">Создать пост</button>
      <span class="info" id="postInfo">Постов: 0 из 5</span>
    </div>
    <ul class="plist" id="postList"></ul>

      <button type="button" class="big" id="resultBtn">Выдать результат</button>

      <div class="status">Иконки: Pixelarticons (Gerrit Halfmann, MIT), Pixel Icon (HackerNoon, CC BY 4.0). Единорог, семья и попкорн нарисованы вручную. Шрифт: Press Start 2P (SIL OFL).</div>
    </div>
  </section>

  <div class="win" id="cardWin" hidden>
    <div class="tb" id="cardTb">
      <span class="tt">Аккаунт</span>
      <span class="tbtns">
        <button type="button" id="wMin" aria-label="Свернуть">_</button>
        <button type="button" id="wMax" aria-label="На весь экран">□</button>
        <button type="button" id="wClose" aria-label="Закрыть">×</button>
      </span>
    </div>
    <div class="client"><div class="cardBody" id="cardBody"></div></div>
  </div>

  <dialog id="postDlg">
    <div class="tb"><span class="tt">Создать пост</span><span class="tbtns"><button type="button" id="postX" aria-label="Закрыть">×</button></span></div>
    <form id="postForm" class="dbody">
      <label class="field">Заголовок <input type="text" name="title" maxlength="80" autocomplete="off"></label>
      <label class="field">Хэштеги <input type="text" name="tags" placeholder="#кино #друзья" maxlength="120" autocomplete="off"></label>
      <label class="field">Текст поста <textarea name="text" rows="4" maxlength="400"></textarea></label>
      <div class="row">
        <label class="field" style="flex:1;margin:0">Цвет <select name="color"></select></label>
        <label class="field" style="flex:1;margin:0">Участники <input type="text" name="people" maxlength="120" autocomplete="off"></label>
      </div>
      <div class="field" style="margin-top:.9rem"><span>Стикер</span><div class="pick-row" id="stickerPick"></div></div>
      <p id="err"></p>
      <div class="buttons">
        <button type="button" id="postCancel">Отмена</button>
        <button type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="askDlg">
    <div class="tb"><span class="tt">Удаление</span></div>
    <div class="dbody">
      <p id="askText"></p>
      <div class="buttons">
        <button type="button" id="askNo">Нет</button>
        <button type="button" id="askYes">Да</button>
      </div>
    </div>
  </dialog>

</main>

function centerStickers() {

  document.body.appendChild(tmp);
  Object.keys(STICKERS).forEach(function (k) {

    try {

      var b = tmp.getBBox();
      STICKERS[k].dx = Math.round(12 - (b.x + b.width / 2)); STICKERS[k].dy = Math.round(12 - (b.y + b.height / 2));
    } catch (e) {}
  });
  document.body.removeChild(tmp);
}

function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
function rgbText(c) { return "rgb(" + c[0] + ", " + c[1] + ", " + c[2] + ")"; }
function fontIndex() { var s = st.s; return (s.hand ? 1 : 0) + (s.calli ? 2 : 0) + (s.wide ? 4 : 0) + (s.official ? 8 : 0); }

/* ---- построение панели ---- */
function fillSelect(id, words, key) {
  var sel = $(id), none = el("option", "", "—");
  none.value = ""; sel.appendChild(none);
  words.forEach(function (w) { var o = el("option", "", w); o.value = w; sel.appendChild(o); });
  sel.value = st[key];
  sel.onchange = function () { st[key] = sel.value; save(); refresh(); };
}
fillSelect("pron1", ["он", "она", "они", "оно"], "p1");
fillSelect("pron2", ["его", "её", "их"], "p2");

SENSORS.forEach(function (x) {
  var row = el("div", "sensor"), lab = el("label", "sw"), inp = document.createElement("input"), tr = el("span", "track"), tx = el("span", "txt");
  inp.type = "checkbox"; inp.checked = st.s[x.id];
  inp.onchange = function () { st.s[x.id] = inp.checked; tx.textContent = inp.checked ? "да" : "нет"; save(); refresh(); };
  tx.textContent = inp.checked ? "да" : "нет";
  lab.appendChild(inp); lab.appendChild(tr); lab.appendChild(tx);
  row.appendChild(el("span", "", x.label)); row.appendChild(lab);
  $("sensors").appendChild(row);
});

$("bgBtn").onclick = function () {
  var c;
  do { c = [rnd(), rnd(), rnd()]; } while (st.bg && c.join() === st.bg.join());
  st.bg = c; st.clicks++; save(); refresh();
};
function rnd() { return Math.floor(Math.random() * 256); }
$("iconBtn").onclick = function () { st.icon = ICON_KEYS[Math.floor(Math.random() * ICON_KEYS.length)]; save(); refresh(); };
$("name").value = st.name; $("user").value = st.user;
$("name").oninput = function () { st.name = this.value; save(); refresh(); };
$("user").oninput = function () { st.user = this.value; save(); refresh(); };

/* ---- посты ---- */
var form = $("postForm"), dlg = $("postDlg"), err = $("err");
function postColor(slot) {
  var bg = cardBg(), t = bestBW(bg), h = rgb2hsl(bg), light = t[0] > 200, L = h[2] + (light ? -0.3 : 0.3), c, k = 0;
  L = Math.min(0.92, Math.max(0.12, L));
  do { c = hsl2rgb(h[0] + SLOT_HUES[slot], Math.min(0.7, Math.max(0.4, h[1])), L); L += light ? -0.03 : 0.03; k++; }
  while (contrast(t, c) < 4.5 && k < 20);
  return c;
}
function postText(c) { var h = rgb2hsl(c); return pickText(c, h[0], Math.max(0.45, h[1])); }
function paintSelect() {
  var sel = form.elements.color, o = sel.options[sel.selectedIndex];
  sel.style.background = o.style.background; sel.style.color = o.style.color;
}
function buildColorOptions() {
  var sel = form.elements.color;
  sel.textContent = "";
  for (var i = 0; i < SLOT_HUES.length; i++) {
    var c = rgbText(postColor(i)), o = el("option", "", c);
    o.value = i; o.style.background = c; o.style.color = rgbText(postText(postColor(i))); sel.appendChild(o);
  }
  paintSelect();
}
form.elements.color.onchange = paintSelect;
var pickItems = [["", "без стикера", "#6b6b66", '<g fill="currentColor" stroke="none" shape-rendering="crispEdges"><path d="M7 19H5v-2h2zm12 0h-2v-2h2zM9 15v2H7v-2zm8 2h-2v-2h2zm-6-2H9v-2h2zm4 0h-2v-2h2zm-2-2h-2v-2h2zm-2-2H9V9h2zm4 0h-2V9h2zM9 9H7V7h2zm8 0h-2V7h2zM7 7H5V5h2zm12 0h-2V5h2z"/></g>']];
Object.keys(STICKERS).forEach(function (k) { pickItems.push([k, STICKERS[k].name, STICKERS[k].color, stickerInner(k)]); });
pickItems.forEach(function (it, i) {
  var lab = el("label", "pick");
  lab.title = it[1];
  lab.innerHTML = '<input type="radio" name="sticker" value="' + it[0] + '"' + (i === 0 ? " checked" : "") + ' aria-label="' + it[1] + '"><span class="chip" style="color:' + it[2] + '"><svg viewBox="0 0 24 24">' + it[3] + "</svg></span>";
  $("stickerPick").appendChild(lab);
});
var editingId = null, deleteId = null;
var ICON_EDIT = '<svg viewBox="0 0 24 24"><g fill="currentColor" stroke="none" shape-rendering="crispEdges"><path d="M4 16h2v2h2v2h2v2H2v-8h2zm8 4h-2v-2h2zm2-2h-2v-2h2zm-4-2H8v-2h2zm6 0h-2v-2h2zM6 14H4v-2h2zm6 0h-2v-2h2zm6 0h-2v-2h2zM8 12H6v-2h2zm6 0h-2v-2h2zm6 0h-2v-2h2zm-10-2H8V8h2zm8 0h-2V8h2zm4 0h-2V8h2zM12 8h-2V6h2zm4 0h-2V6h2zm4 0h-2V6h2zm-6-2h-2V4h2zm4 0h-2V4h2zm-2-2h-2V2h2z"/></g></svg>';
var ICON_DEL = '<svg viewBox="0 0 24 24"><g fill="currentColor" stroke="none" shape-rendering="crispEdges"><path d="M18 22H6v-2h12zM9 6h6V4h2v2h5v2h-2v12h-2V8H6v12H4V8H2V6h5V4h2zm6-2H9V2h6z"/></g></svg>';
$("postBtn").onclick = function () { editingId = null; form.reset(); buildColorOptions(); err.textContent = ""; dlg.showModal(); };
$("postCancel").onclick = function () { dlg.close(); };
$("postX").onclick = function () { dlg.close(); };
form.onsubmit = function (ev) {
  ev.preventDefault();
  var f = form.elements;
  if (!f.title.value.trim()) { err.textContent = "Впишите заголовок."; return; }
  var data = { title: f.title.value.trim(), tags: f.tags.value.trim(), text: f.text.value.trim(), slot: Number(f.color.value), people: f.people.value.trim(), sticker: f.sticker.value };
  var old = st.posts.filter(function (x) { return x.id === editingId; })[0];
  if (old) Object.assign(old, data);
  else {
    if (st.posts.length >= MAX_POSTS) { err.textContent = "Постов уже " + MAX_POSTS + "."; return; }
    st.posts.push(Object.assign(data, { id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) }));
  }
  save(); dlg.close(); refresh();
};
function openEdit(post) {
  editingId = post.id; form.reset(); buildColorOptions();
  var f = form.elements;
  f.title.value = post.title; f.tags.value = post.tags || ""; f.text.value = post.text || "";
  f.color.value = post.slot; paintSelect(); f.people.value = post.people || ""; f.sticker.value = post.sticker || "";
  err.textContent = ""; dlg.showModal();
}
function iconBtn(label, svg, fn) {
  var b = el("button", "iconb"); b.type = "button"; b.innerHTML = svg; b.setAttribute("aria-label", label); b.onclick = fn; return b;
}
function renderPostList() {
  var ul = $("postList"); ul.textContent = "";
  st.posts.forEach(function (post) {
    var li = el("li"), t = el("span", "ttl", post.title);
    li.appendChild(t);
    li.appendChild(iconBtn("Править пост", ICON_EDIT, function () { openEdit(post); }));
    li.appendChild(iconBtn("Удалить пост", ICON_DEL, function () { deleteId = post.id; $("askText").textContent = "Удалить пост «" + post.title + "»?"; $("askDlg").showModal(); }));
    ul.appendChild(li);
  });
}
$("askNo").onclick = function () { $("askDlg").close(); };
$("askYes").onclick = function () {
  st.posts = st.posts.filter(function (x) { return x.id !== deleteId; });
  save(); $("askDlg").close(); refresh();
};

$("resultBtn").onclick = function () { st.shown = true; save(); refresh(); };

/* ---- окно аккаунта: двигать, свернуть, на весь экран, закрыть ---- */
var win = $("cardWin"), drag = null;
$("wMin").innerHTML = glyph("min"); $("wMax").innerHTML = glyph("max"); $("wClose").innerHTML = glyph("close"); $("postX").innerHTML = glyph("close");
function applyWin() {
  var w = st.win;
  if (w.x === null) { w.x = Math.max(0, Math.round((window.innerWidth - win.offsetWidth) / 2)); w.y = 40; }
  w.x = Math.min(Math.max(w.x, 80 - win.offsetWidth), window.innerWidth - 80);
  w.y = Math.min(Math.max(w.y, 0), window.innerHeight - 30);
  win.style.left = w.x + "px"; win.style.top = w.y + "px";
  win.classList.toggle("max", w.max); win.classList.toggle("min", w.min);
  $("wMax").innerHTML = glyph(w.max ? "restore" : "max");
  $("wMax").setAttribute("aria-label", w.max ? "Вернуть прежний размер" : "На весь экран");
  $("wMin").setAttribute("aria-label", w.min ? "Развернуть" : "Свернуть");
}
function toggleMax() { st.win.max = !st.win.max; if (st.win.max) st.win.min = false; save(); applyWin(); }
$("wMin").onclick = function () { st.win.min = !st.win.min; if (st.win.min) st.win.max = false; save(); applyWin(); };
$("wMax").onclick = toggleMax;
$("wClose").onclick = function () { st.shown = false; save(); renderCard(); };
$("cardTb").ondblclick = function (e) { if (!e.target.closest("button")) toggleMax(); };
$("cardTb").addEventListener("pointerdown", function (e) {
  if (e.target.closest("button") || st.win.max) return;
  drag = { dx: e.clientX - st.win.x, dy: e.clientY - st.win.y };
  this.setPointerCapture(e.pointerId);
});
$("cardTb").addEventListener("pointermove", function (e) {
  if (!drag) return;
  st.win.x = e.clientX - drag.dx; st.win.y = e.clientY - drag.dy; applyWin();
});
function endDrag() { if (drag) { drag = null; save(); } }
$("cardTb").addEventListener("pointerup", endDrag);
$("cardTb").addEventListener("pointercancel", endDrag);
window.addEventListener("resize", function () { if (st.shown) applyWin(); });

/* ---- цвета ---- */
var HUES = [0, 40, 80, 180, 220, 320];
var POST_HUES = [-50, -30, -10, 10, 30, 50];
var SLOT_HUES = [30, 80, 130, 180, 230, 280, 330];
function hex2rgb(h) { h = h.replace("#", ""); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function lum(c) {
  var a = c.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
}
function contrast(a, b) { var x = lum(a), y = lum(b); if (x < y) { var t = x; x = y; y = t; } return (x + 0.05) / (y + 0.05); }
function rgb2hsl(c) {
  var r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
  if (d) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}
function bestBW(bg) { var w = [255, 255, 255], k = [31, 26, 46]; return contrast(w, bg) > contrast(k, bg) ? w : k; }
function pickText(bg, hue, sat) {
  var dark = contrast([0, 0, 0], bg) >= contrast([255, 255, 255], bg), best = null, top = 0;
  for (var i = 0; i <= 16; i++) {
    var c = hsl2rgb(hue, sat, dark ? 0.5 - i * 0.03 : 0.5 + i * 0.03), k = contrast(c, bg);
    if (k >= 4.5) return c;
    if (k > top) { top = k; best = c; }
  }
  return best;
}
function chipColor(bg, i, hues) {
  var h = rgb2hsl(bg);
  hues = hues || HUES;
  return hsl2rgb(h[0] + hues[i % hues.length], 0.6, h[2] > 0.55 ? 0.2 : 0.9);
}

/* ---- плашка аккаунта ---- */
function stickerSvg(key) { return '<svg class="st" viewBox="0 0 24 24">' + stickerInner(key) + "</svg>"; }
function cardBg() { return st.bg || [221, 221, 221]; }

function renderCard() {
  var body = $("cardBody"), f = FONTS[fontIndex()], bg = cardBg();
  win.hidden = !st.shown;
  if (!st.shown) return;
  win.style.setProperty("--c", rgbText(bg));
  win.style.setProperty("--tc", rgbText(bestBW(bg)));
  body.textContent = "";
  body.style.fontFamily = f[1];
  var head = el("div", "head"), who = el("div"), nick = el("div", "nick");
  var ic = el("span", "circle"); setIcon(ic, st.icon); head.appendChild(ic);
  nick.appendChild(document.createTextNode(st.name || "—"));
  var pr = [st.p1, st.p2].filter(Boolean).join("/");
  if (pr) nick.appendChild(el("span", "pron", pr));
  who.appendChild(nick);
  who.appendChild(el("div", "sub", st.user ? "@" + st.user.replace(/^@+/, "") : "—"));
  head.appendChild(who); body.appendChild(head);
  st.posts.forEach(function (p) {
    var box = el("div", "post");
    var pc = postColor(p.slot);
    box.dataset.rgb = pc.join(",");
    box.style.setProperty("--pc", rgbText(pc));
    box.style.color = rgbText(postText(pc));
    box.appendChild(el("span", "t", p.title));
    if (p.text) box.appendChild(el("p", "", p.text));
    if (p.tags || p.people) {
      var meta = el("div", "meta");
      if (p.tags) meta.appendChild(el("span", "", p.tags));
      if (p.people) meta.appendChild(el("span", "ppl", p.people));
      box.appendChild(meta);
    }
    if (p.sticker && STICKERS[p.sticker]) {
      var m = el("span", "mini"); m.style.color = STICKERS[p.sticker].color; m.innerHTML = stickerSvg(p.sticker); box.appendChild(m);
    }
    body.appendChild(box);
  });
  if (st.s.color || st.s.wordbg) decorate(body, bg);
  applyWin();
}

function decorate(root, bg) {
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [], n, i = 0;
  while ((n = walker.nextNode())) { if (n.nodeValue.trim() && !n.parentNode.closest(".circle, .mini")) nodes.push(n); }
  var hsl = rgb2hsl(bg);
  nodes.forEach(function (node) {
    var post = node.parentNode.closest(".post"), base = post ? post.dataset.rgb.split(",").map(Number) : bg, bh = rgb2hsl(base);
    var frag = document.createDocumentFragment();
    node.nodeValue.split(/(\s+)/).forEach(function (part) {
      if (!part) return;
      if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
      var hs = post ? POST_HUES : HUES, w = el("span", "w", part), hue = bh[0] + hs[i % hs.length], sat = Math.max(0.8, bh[1]), under = base;
      if (st.s.wordbg) { under = chipColor(base, i, hs); w.className = "w wchip"; w.style.background = rgbText(under); }
      w.style.color = rgbText(st.s.color ? pickText(under, hue, sat) : bestBW(under));
      frag.appendChild(w); i++;
    });
    node.parentNode.replaceChild(frag, node);
  });
}

/* ---- обновление экрана ---- */
function refresh() {
  $("bgCode").textContent = st.bg ? rgbText(st.bg) : "—";
  $("bgSwatch").style.background = st.bg ? rgbText(st.bg) : "";
  $("bgCount").textContent = st.clicks;
  setIcon($("iconView"), st.icon);
  $("postInfo").textContent = "Постов: " + st.posts.length + " из " + MAX_POSTS;
  $("postBtn").disabled = st.posts.length >= MAX_POSTS;
  renderPostList();
  renderCard();
}
refresh();
</script>
</body>
